name: Build and Publish Verification Image

on:
  push:
    branches: [master, develop]
    paths:
      - 'docker/verification/**'
      - 'app/Jobs/RunVerificationJob.php'
      - '.github/workflows/verification.yml'
  workflow_dispatch:

concurrency:
  group: verification-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/verification
  CANDIDATE_TAG: verification-candidate:ci

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build candidate image
        uses: docker/build-push-action@v7
        with:
          context: docker/verification
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.CANDIDATE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image and the host agree on the check suite
        run: |
          CONTAINER_JSON="$(docker run --rm --network=none "$CANDIDATE_TAG")"
          echo "Container reported: $CONTAINER_JSON"

          CONTAINER_CHECKS="$(printf '%s' "$CONTAINER_JSON" | sed -n 's/.*"checks_version":"\([^"]*\)".*/\1/p')"
          HOST_CHECKS="$(sed -n "s/.*LATEST_CHECKS_VERSION = '\([^']*\)'.*/\1/p" app/Jobs/RunVerificationJob.php)"

          if [ -z "$CONTAINER_CHECKS" ]; then
            echo "::error::Image reported no checks_version. It may not be emitting the expected JSON contract."
            exit 1
          fi

          if [ "$CONTAINER_CHECKS" != "$HOST_CHECKS" ]; then
            echo "::error::Check suite mismatch: image reports '$CONTAINER_CHECKS', host expects '$HOST_CHECKS'. Bump CheckRegistry.ChecksVersion and RunVerificationJob::LATEST_CHECKS_VERSION together."
            exit 1
          fi

          echo "Check suite $CONTAINER_CHECKS agrees with the host."

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: docker/verification
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
